<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Bay — 落日湾</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a2233; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* The minimap lives in the top-right corner, over the canvas; the renderer paints it. */
  #minimap { position: fixed; top: 12px; right: 12px; width: 220px; height: 150px;
    border: 2px solid rgba(255, 255, 255, 0.35); border-radius: 8px; background: rgba(20, 26, 40, 0.85); }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Sunset Bay: open-world driving in a sunny seaside city. Walk with WASD, press E to get in a car, drive, take jobs and lose the police."></canvas>
<canvas id="minimap" width="220" height="150" aria-label="Minimap of Sunset Bay"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
